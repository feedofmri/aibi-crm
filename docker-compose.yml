services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: biai
      POSTGRES_PASSWORD: biai_dev_password
      POSTGRES_DB: biai_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biai -d biai_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://biai:biai_dev_password@db:5432/biai_crm
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell or .env}
    ports:
      - "4000:4000"

volumes:
  pgdata:
