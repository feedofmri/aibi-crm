name: Deploy to cPanel (biai-crm.boraqs.com + biai-simulator.boraqs.com)
# Builds the CRM (API + web app, bundled into a few files) and the channel simulator (static
# site), uploads both to cPanel over FTPS (or rsync over SSH when a key is set), restarts the
# Node.js app through Passenger, then checks both sites answer. Setup: docs/cpanel-setup.md.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "simulator/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cpanel.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: deploy-cpanel, cancel-in-progress: false }
env:
  CRM_URL: https://biai-crm.boraqs.com
  SIMULATOR_URL: https://biai-simulator.boraqs.com
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CHANNEL_KEY: ${{ secrets.CHANNEL_KEY }}
      # Both live inside one "biai" folder in the cPanel home directory.
      APP_DIR: ${{ vars.CPANEL_APP_DIR || 'biai/crm' }}
      SIM_DIR: ${{ vars.CPANEL_SIMULATOR_DIR || 'biai/simulator' }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_USER" ]; then
            echo "No cPanel credentials yet (CPANEL_HOST, CPANEL_USER); skipping deploy."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$CPANEL_SSH_KEY" ] && [ -z "$CPANEL_FTP_PASSWORD" ]; then
            echo "::error::Set CPANEL_FTP_PASSWORD (FTP deploy) or CPANEL_SSH_KEY (SSH deploy)."; exit 1
          fi
          if [ -z "$CHANNEL_KEY" ]; then
            echo "::error::Set the CHANNEL_KEY secret (the same value as CHANNEL_KEY in the cPanel app's settings)."; exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip != '1'
        with: { node-version: "22", cache: npm }

      - name: Build
        if: steps.creds.outputs.skip != '1'
        run: |
          npm ci
          npm run build -w client
          npm run bundle -w server              # deploy/crm: server.mjs, app.cjs, migrations/, public/
          VITE_API_URL="$CRM_URL" VITE_CHANNEL_KEY="$CHANNEL_KEY" npm run build -w simulator
          cp -r simulator/dist deploy/simulator
          find deploy/simulator -name "*.map" -delete
          date -u > deploy/crm/tmp/restart.txt  # Passenger restarts the app when this file changes
          echo "Files to upload: $(find deploy -type f | wc -l)"

      - name: Upload over SSH (rsync)
        if: steps.creds.outputs.skip != '1' && env.CPANEL_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh && echo "$CPANEL_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          PORT="${CPANEL_SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "::error::Cannot reach SSH on $CPANEL_HOST port $PORT. Without SSH access, delete the CPANEL_SSH_KEY secret to deploy over FTP."; exit 1; }
          SSH="ssh -i ~/.ssh/id -p $PORT"
          $SSH "$CPANEL_USER@$CPANEL_HOST" "mkdir -p $APP_DIR/tmp $SIM_DIR"
          rsync -az --delete --exclude ".env" --exclude "stderr.log" --exclude ".htaccess" --exclude ".well-known" \
            --exclude "cgi-bin" --exclude "tmp/" -e "$SSH" deploy/crm/ "$CPANEL_USER@$CPANEL_HOST:$APP_DIR/"
          rsync -az --delete --exclude ".htaccess" --exclude ".well-known" --exclude "cgi-bin" \
            -e "$SSH" deploy/simulator/ "$CPANEL_USER@$CPANEL_HOST:$SIM_DIR/"
          $SSH "$CPANEL_USER@$CPANEL_HOST" "touch $APP_DIR/tmp/restart.txt"

      - name: Upload over FTPS (lftp)
        if: steps.creds.outputs.skip != '1' && env.CPANEL_SSH_KEY == ''
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lf() { lftp -u "$CPANEL_USER","$CPANEL_FTP_PASSWORD" "ftp://$CPANEL_HOST" \
                   -e "set ftp:ssl-force true; set ssl:verify-certificate ${{ vars.CPANEL_FTP_VERIFY_TLS || 'yes' }}; set net:max-retries 3; $1; bye"; }
          lf "mkdir -p -f $APP_DIR/tmp; mkdir -p -f $SIM_DIR"
          # Never delete server-side files cPanel or the host manage (.htaccess, logs, SSL checks).
          lf "mirror -R --delete --no-symlinks --parallel=4 --exclude-glob .env --exclude-glob stderr.log \
              --exclude-glob .htaccess --exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob tmp/ \
              deploy/crm/ $APP_DIR/"
          lf "mirror -R --delete --no-symlinks --parallel=4 --exclude-glob .htaccess --exclude-glob .well-known/ \
              --exclude-glob cgi-bin/ deploy/simulator/ $SIM_DIR/"
          # Restart only once every file is in place, so the app never starts on a half-uploaded file.
          lf "put deploy/crm/tmp/restart.txt -o $APP_DIR/tmp/restart.txt"

      - name: Smoke test
        if: steps.creds.outputs.skip != '1'
        run: |
          ok=""
          for i in 1 2 3 4 5 6 7 8 9; do
            if curl -fsS "$CRM_URL/api/health" | grep -q '"status":"ok"'; then ok=1; break; fi; sleep 10
          done
          [ -n "$ok" ] || { echo "::error::The CRM is not answering $CRM_URL/api/health. In cPanel open Setup Node.js App → biai/crm: check the startup file (app.cjs) and environment variables, read biai/crm/stderr.log, then Restart."; exit 1; }
          curl -fsS "$CRM_URL/login" | grep -q 'id="root"' || { echo "::error::The CRM web app is not served at $CRM_URL/login"; exit 1; }
          curl -fsS "$SIMULATOR_URL/" | grep -q 'id="root"' || { echo "::error::The simulator is not served at $SIMULATOR_URL. Point the subdomain's document root at $SIM_DIR."; exit 1; }
          # The simulator site may call the CRM's inbound API from the browser (CORS) with the channel key.
          headers=$(curl -fsS -D - -o /dev/null -H "Origin: $SIMULATOR_URL" -H "X-Channel-Key: $CHANNEL_KEY" "$CRM_URL/api/channels/info") || {
            echo "::error::The inbound channel API refused the simulator. CHANNEL_KEY in cPanel must equal the CHANNEL_KEY secret."; exit 1; }
          echo "$headers" | grep -qi "access-control-allow-origin: $SIMULATOR_URL" || {
            echo "::error::CORS is not allowed for $SIMULATOR_URL. Set CHANNEL_ALLOWED_ORIGINS=$SIMULATOR_URL in cPanel."; exit 1; }
          echo "Deployed: $CRM_URL and $SIMULATOR_URL"
