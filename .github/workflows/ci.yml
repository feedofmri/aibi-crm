name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["12", "16"] # cPanel hosts often run an older PostgreSQL
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: biai_crm_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Type-check the CRM and the simulator
        run: npm run typecheck
      - name: Build the CRM and the simulator
        run: npm run build
      - name: Server tests (unit + API integration against PostgreSQL ${{ matrix.postgres }})
        run: npm test
        env: { TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/biai_crm_test" }
      - name: Production bundle builds
        run: npm run bundle -w server
