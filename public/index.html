<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf7f2" />
    <title>BIAI Admissions CRM</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/brand.css" />
    <link rel="icon" href="/assets/biai-icon.png" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="BIAI home"
        ><img class="brand-icon" src="/assets/biai-icon.png" alt="" /><img
          class="brand-wordmark"
          src="/assets/biai-logo.png"
          alt="BIAI"
        /><span class="brand-sub">ADMISSIONS CRM</span></a
      >
      <p class="nav-label">Admissions</p>
      <nav>
        <button data-view="pipeline" class="nav-item active">
          Pipeline <b id="nav-count">0</b></button
        ><button data-view="enquiries" class="nav-item">All enquiries</button
        ><button data-view="followups" class="nav-item">
          Follow-ups <b id="due-count"></b></button
        ><button data-view="insights" class="nav-item">Weekly brief</button>
        <button data-view="automation" class="nav-item">
          Automation <b id="review-count"></b>
        </button>
      </nav>
      <div class="sidebar-bottom">
        <div class="profile" id="user-profile" role="button" tabindex="0" title="Click to manage account or switch user">
          <span class="avatar" id="sidebar-avatar">AB</span>
          <div id="sidebar-user-text">
            <strong id="sidebar-user-name">Admin BIAI</strong>
            <small id="sidebar-user-role">Admin</small>
          </div>
          <span class="switch-badge" title="Switch User">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
        </div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div>
          <span class="breadcrumb">Workspace</span><span class="slash">/</span
          ><span id="breadcrumb">Pipeline</span>
        </div>
        <div class="topbar-right">
          <a href="/simulator" target="_blank" class="simulator-pill-btn" title="Omnichannel Inbound Simulator">Channel Simulator &rarr;</a>
          <span id="db-mode" class="mode-pill"></span>
          <span id="mode" class="mode-pill"></span>
          <span class="top-date" id="date"></span>
        </div>
      </header>
      <main>
        <div class="heading">
          <div>
            <h1 id="page-title">Sales pipeline</h1>
            <p id="page-subtitle">
              Track enquiries by stage and manage follow-ups.
            </p>
          </div>
          <button class="primary" id="new-enquiry">
            + New enquiry
          </button>
        </div>
        <div id="mode-banner" class="notice" hidden></div>
        <section
          class="metrics"
          id="metrics"
          aria-label="Workspace metrics"
        ></section>
        <section id="content"></section>
        <footer>
          BIAI Admissions CRM · Prototype on fictional sample data · Times in Asia/Dhaka
        </footer>
      </main>
    </div>
    <dialog
      id="detail-dialog"
      class="detail-dialog"
      aria-labelledby="detail-title"
    >
      <div id="detail"></div>
    </dialog>
    <dialog
      id="intake-dialog"
      class="intake-dialog"
      aria-labelledby="intake-title"
    >
      <div id="intake"></div>
    </dialog>
    <dialog
      id="auth-dialog"
      class="auth-dialog"
      aria-labelledby="auth-title"
    >
      <div id="auth-box"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
